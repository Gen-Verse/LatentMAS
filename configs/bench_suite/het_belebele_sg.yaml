# AUTO-DERIVED run config (het pool, belebele_sg suite) -- n=200/lang,
# checkpointing+resume on, isolated checkpoint dir, 3 GPUs via
# CUDA_VISIBLE_DEVICES (launcher). See scripts/bench_suite/.
project:
  name: bench_het_belebele_sg
  version: 0.2.0
  description: Decentralized multi-agent reasoning with a genuinely heterogeneous
    (cross-architecture) agent pool
  output_dir: results/bench_suite/het_belebele_sg
  seed: 42
agents:
- id: orchestrator
  model_id: aisingapore/Llama-SEA-LION-v3-8B-IT
  role: orchestrator
  device: cuda:0
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 64
- id: translation_agent
  model_id: sail/Sailor2-8B-Chat
  role: translation
  device: cuda:0
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 64
- id: reasoning_agent
  model_id: meta-llama/Llama-3.1-8B-Instruct
  role: reasoning
  device: cuda:1
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 64
- id: safety_agent
  model_id: CohereLabs/aya-expanse-8b
  role: safety
  device: cuda:2
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 64
universal_latent_space:
  universal_dim: 2048
  adapter_hidden_dim: 1024
  adapter_dropout: 0.1
  adapter_training:
    enabled: true
    n_samples: 64
    n_epochs: 50
    lr: 0.001
    batch_size: 32
    dae_sigma: 0.1
    mu_cka: 1.0
    gamma_dae: 1.0
latent_reasoning:
  enabled: false
  max_steps: 10
  tau_exit: 0.8
verification:
  enabled: false
  tau_drift: 0.5
  n_epochs: 100
  lr: 0.001
cvae:
  query_dim: 64
  graph_dim: 9
  condition_on_geometry: false
  geo_profile_path: results/mechanistic/geo_profiles.json
  latent_dim: 32
  encoder_hidden:
  - 128
  - 64
  decoder_hidden:
  - 64
  - 128
  training:
    n_epochs: 100
    lr: 0.001
    beta_max: 4.0
    warmup_epochs: 10
    batch_size: 64
  checkpoint_path: .cache/checkpoints/coordination_heterogeneous/cvae
orchestration:
  n_intent_centroids: 8
  routing_strategy: attention
  timeout_per_agent_s: 120
communication:
  modes:
  - token
  - latent
  - hybrid
  track_all: true
  latent_transfer_layer: -4
  eval_modes:
  - single_agent_baseline
  - token_based_mas
  - oneflow
  - latent_based_mas_ours
  backend: auto
benchmarks:
  flores_plus:
    enabled: false
    translation_metrics:
      chrf: true
      xcomet: false
      cometkiwi: false
  belebele:
    enabled: true
    n_samples: 200
    languages: &id001
    - en
    - th
    - my
    - km
    - lo
    - am
    - sw
    - bn
    - te
    scoring: loglikelihood
  sea_safeguardbench:
    enabled: true
    n_samples: 200
    languages:
    - th
    - my
    repo_id: aisingapore/Safety-Toxicity-Detection
ablation:
  extra_rows: []
visualization:
  save_formats:
  - png
  - pdf
  dpi: 300
  style: seaborn-v0_8-whitegrid
  plots:
  - agent_topology
  - cvae_latent_space
  - topology_evolution
  - transfer_matrix
  - token_vs_latent_cost
  - accuracy_vs_latency
  - scalability
  - universal_space_embeddings
  - transfer_trajectory
  - intent_centroids
  - communication_timeline
checkpointing:
  enabled: true
  interval_stages: 1
  keep_last_n: 5
  checkpoint_dir: .cache/checkpoints/bench_suite/het_belebele_sg
logging:
  level: INFO
  log_dir: logs/coordination_heterogeneous
  json_logs: true
parallelism:
  n_workers: 4
  use_asyncio: true
target_languages: *id001
