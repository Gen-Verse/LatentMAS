# Time-boxed variant of configs/latent_coordination_heterogeneous.yaml.
#
# The full-size config's per-role max_new_tokens (128/256/512) combined with an
# observed real decode throughput of ~5.4 tok/s on V100-16GB (measured live on
# 2026-07-02, see dev_doc.md Section 5's "Correction") made the 3-agent comm-modes
# (token_based_mas, latent_based_mas_ours -- 896 output tokens/task, all 3 agents run)
# cost ~26-28h per instance at n=100/language, ~6x the originally planned ~4-5h. This
# variant uniformly caps max_new_tokens at 96 across translation/reasoning/safety
# (also incidentally fixes a routing-driven cost asymmetry: single_agent_baseline's
# cost used to depend entirely on which agent the router picked as sole executor,
# since 128 vs 256 vs 512 differ a lot; uniform 96 removes that confound) and drops
# n_samples_per_language to 50, landing at ~3.85h/instance -- see dev_doc.md Section 5.
project:
  name: latent_coordination_heterogeneous_timeboxed
  version: 0.2.0
  description: Time-boxed heterogeneous cross-architecture run (~4h/instance)
  output_dir: results/coordination_heterogeneous_timeboxed
  seed: 42
agents:
- id: orchestrator
  model_id: aisingapore/Llama-SEA-LION-v3-8B-IT
  role: orchestrator
  device: cuda:0
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 96
- id: translation_agent
  model_id: sail/Sailor2-8B-Chat
  role: translation
  device: cuda:1
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 96
- id: reasoning_agent
  model_id: meta-llama/Llama-3.1-8B-Instruct
  role: reasoning
  device: cuda:2
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 96
- id: safety_agent
  model_id: CohereLabs/aya-expanse-8b
  role: safety
  device: cuda:3
  torch_dtype: float16
  load_in_8bit: true
  max_new_tokens: 96
universal_latent_space:
  universal_dim: 2048
  adapter_hidden_dim: 1024
  adapter_dropout: 0.1
  adapter_training:
    # Module A+B interlingua regularization (L_recon + gamma*L_DAE + mu*L_CKA with
    # the unbiased-HSIC CKA estimator). When enabled=false the hub adapters stay
    # RANDOM-INIT and latent_based_mas_ours results are not reportable -- Stage C
    # logs a loud warning. Enabling requires real forward passes through every
    # agent model on n_samples FLORES+ prompts (budget accordingly on V100).
    enabled: false
    n_samples: 64
    n_epochs: 50
    lr: 0.001
    batch_size: 32
    dae_sigma: 0.1
    mu_cka: 1.0
    gamma_dae: 1.0
cvae:
  query_dim: 64
  graph_dim: 9
  latent_dim: 32
  encoder_hidden:
  - 128
  - 64
  decoder_hidden:
  - 64
  - 128
  training:
    n_epochs: 100
    lr: 0.001
    beta_max: 4.0
    warmup_epochs: 10
    batch_size: 64
  checkpoint_path: .cache/checkpoints/coordination_heterogeneous_timeboxed/cvae
orchestration:
  n_intent_centroids: 8
  routing_strategy: latent_centroid
  # parallel_agents/max_parallel_workers removed: the latent chain is sequential
  # by design (each agent consumes the previous agent's transferred hidden state),
  # so per-task agent parallelism is impossible; parallel_agents=true now fails
  # loudly instead of being silently ignored. Parallelize across languages/instances.
  # timeout_per_agent_s: wall-clock cap per agent generate() call (transformers'
  # max_time stopping criterion); a runaway decode stops at the budget.
  timeout_per_agent_s: 60
communication:
  modes:
  - token
  - latent
  - hybrid
  track_all: true
  latent_transfer_layer: -4
  # latent_based_mas_ours goes through AdaptiveOrchestrator.execute ->
  # UniversalLatentHub.transfer, which registers each agent by its actual hidden_dim
  # and routes through a per-agent adapter pair -- dimension/architecture-agnostic by
  # design (Module B, dev_doc.md Section 2). It runs fine on this heterogeneous pool;
  # there is no special-cased failure mode here (an earlier version of this comment,
  # and of dev_doc.md's cost table, incorrectly claimed otherwise by analogy with the
  # unrelated standalone LatentMASBaseline class, which does hard-require matching
  # hidden dims -- that class isn't used by this pipeline).
  eval_modes:
  - single_agent_baseline
  - token_based_mas
  - latent_based_mas_ours
  backend: auto
benchmarks:
  flores_plus:
    # xcomet/cometkiwi disabled: unbabel-comet's dependency resolution force-upgrades
    # transformers/accelerate (4.46.3->4.57.6, 1.1.1->1.13.0 observed 2026-07-02),
    # breaking the pinned versions this pipeline's agent generation depends on
    # (pyproject.toml's own comment already warned this would happen). Both crashed
    # every run that reached this point regardless -- xcomet with a plain ImportError
    # (package never actually installed despite being in pyproject.toml), then after
    # installing it, cometkiwi/xcomet loading failed with a separate
    # "tensorflow_text backend" error from the newer transformers. Not fixed further
    # this session -- needs a proper isolated env (e.g. a separate venv/subprocess for
    # COMET scoring) to use safely alongside this pipeline. chrf has no such
    # dependency risk (sacrebleu only) and stays on.
    translation_metrics:
      chrf: true
      xcomet: false
      cometkiwi: false
    # 20/language x 3 languages/instance x 3 comm-modes @ 96 max_new_tokens/agent
    # (uniform) ~= 2.45h/instance on 4 GPUs, calibrated from live per-task timing
    # (single_agent_baseline ~21s/task, 3-agent modes ~63s/task) observed 2026-07-02.
    # Run as 2 parallel instances (--languages th,my,km / lo,am,sw,
    # --agents ...device=cuda:4..7, --output-dir
    # results/coordination_heterogeneous_timeboxed_2) to cover all 6 languages across
    # all 8 GPUs in the same wall-clock budget.
    n_samples_per_language: 20
  sea_vision:
    enabled: true
    n_samples_per_language: 200
    local_dir: null
  sea_safeguardbench:
    enabled: true
    n_samples: 200
# Staircase ablation (strategy.md 7.3): the canonical rows 0-6 + 7a live in
# latent_coordination/eval/ablation_staircase.py::STAIRCASE_ROWS and are run via
# scripts/run_ablation_staircase.py (ALWAYS --dry-run first; full staircase is
# multiple GPU-days). The previous block here (communication_modes/n_agents_sweep/
# topology_types) was aspirational config no code ever read and promised sweeps
# (2-16 agents, ring topologies) the 3-role pipeline cannot execute -- removed.
# extra_rows: additions like 7d (Geo_L raw-65 via cvae.geo_profile_path override)
# or 7e (verification.probe_arch: mlp), each {name, isolates, overrides:{dotted: v}}.
ablation:
  extra_rows: []
visualization:
  save_formats:
  - png
  - pdf
  dpi: 300
  style: seaborn-v0_8-whitegrid
  plots:
  - agent_topology
  - cvae_latent_space
  - topology_evolution
  - transfer_matrix
  - token_vs_latent_cost
  - accuracy_vs_latency
  - scalability
  - universal_space_embeddings
  - transfer_trajectory
  - intent_centroids
  - communication_timeline
checkpointing:
  enabled: true
  interval_stages: 1
  keep_last_n: 5
  checkpoint_dir: .cache/checkpoints/coordination_heterogeneous_timeboxed
logging:
  level: INFO
  log_dir: logs/coordination_heterogeneous_timeboxed
  json_logs: true
parallelism:
  n_workers: 4
  use_asyncio: true
