name: vllm_env

channels:
  - conda-forge
  - defaults

dependencies:
  # Core
  - python=3.11
  - pip

  # Scientific stack
  - numpy<2
  - pandas
  - matplotlib
  - scipy

  # Useful system libs
  - setuptools
  - wheel
  - ninja

  - pip:
      ##################################################
      # NVIDIA GPU Deep Learning Stack
      ##################################################

      # PyTorch CUDA build
      - torch==2.5.1
      - torchvision==0.20.1
      - torchaudio==2.5.1

      # vLLM inference engine
      - vllm==0.6.4.post1


      ##################################################
      # HuggingFace / LLM infrastructure
      ##################################################

      - transformers==4.46.3
      - tokenizers==0.20.3
      - datasets==3.1.0
      - huggingface-hub==0.26.2
      - accelerate==1.1.1

      # Model formats/tokenizers
      - safetensors==0.4.5
      - sentencepiece==0.2.0
      - tiktoken==0.8.0
      - protobuf==5.28.3


      ##################################################
      # APIs / serving
      ##################################################

      - fastapi==0.115.5
      - uvicorn==0.32.1
      - openai==1.55.0
      - pydantic==2.9.2
      - starlette==0.41.3


      ##################################################
      # Async / networking
      ##################################################

      - aiohttp==3.11.7
      - requests==2.32.3
      - urllib3==2.2.3
      - anyio==4.6.2.post1
      - uvloop==0.21.0


      ##################################################
      # vLLM dependencies
      ##################################################

      - compressed-tensors==0.8.0
      - xgrammar==0.1.7
      - outlines-core>=0.1.14,<0.2
      - lm-format-enforcer==0.10.9


      ##################################################
      # Utilities
      ##################################################

      - tqdm==4.67.0
      - pyyaml==6.0.2
      - regex==2024.11.6
      - rich==13.9.4
      - click==8.1.7
      - filelock==3.16.1
      - fsspec==2024.9.0
      - cloudpickle==3.1.0
      - psutil==6.1.0
      - py-cpuinfo==9.0.0

      # Data formats
      - pyarrow==18.0.0
      - dill==0.3.8
      - multiprocess==0.70.16
      - xxhash==3.5.0

      # Math
      - sympy==1.13.1
      - networkx==3.4.2

      # Templates/security
      - jinja2==3.1.4
      - cryptography==43.0.3